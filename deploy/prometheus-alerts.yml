# Example Prometheus alert rules for the wrapper's /metrics.
groups:
  - name: keitaro-wrapper
    rules:
      - alert: KeitaroApiKeyRejected
        expr: keitaro_api_key_valid == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Keitaro rejects the wrapper's API key
          description: Every Keitaro call fails with 401/403. Check KEITARO_API_KEY.

      - alert: KeitaroErrors
        expr: |
          sum(rate(keitaro_requests_total{status=~"5..|error"}[5m]))
            / sum(rate(keitaro_requests_total[5m])) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 20% of Keitaro requests fail

      - alert: AutoSyncStale
        expr: time() - auto_sync_last_success_timestamp > 3 * 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Background sync with Keitaro has not completed recently

      - alert: ApiErrors
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The wrapper API returns 5xx errors
